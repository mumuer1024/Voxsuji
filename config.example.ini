; voxsuji — non-secret settings. Secrets belong in `.env`, never here.
; Copy this file to `config.ini` and edit it to match your setup:
;
;   cp config.example.ini config.ini
;
; All values below are examples. Replace them with your own before use.

[asr]
; provider used when --provider is not given
default_provider = aliyun
; async poll tuning for filetrans-style providers
poll_interval = 5
poll_timeout = 1800

[subtitles]
; preference order when several subtitle tracks exist
preferred_languages = zh-Hans,zh-CN,zh,en

[tools]
; override binaries if needed
; ytdlp = /usr/local/bin/yt-dlp
; ffmpeg = /usr/bin/ffmpeg
; ffprobe = /usr/bin/ffprobe

[provider.aliyun]
model = qwen-audio-3.0-asr-flash-filetrans

[provider.volcengine]
; model / resource id can be overridden here (VOLC_RESOURCE_ID wins if set)
; model = volc.seedasr.auc
; model = volc.bigasr.auc

[provider.tencent]
; model = 16k_zh

[network]
http_timeout = 60
upload_timeout = 300

[storage]
; Non-secret parts of an S3-compatible object storage configuration.
; The access key / secret key (and normally the bucket name) live in `.env`.
; These are example values only — replace them with your own storage.
; The bucket must be publicly readable: ASR providers need a public URL
; to fetch the temporary audio object.
endpoint = https://s3.example.com
region = example-region
bucket = your-bucket
path_style = false
; public_base_url =

[cookies]
; Optional Netscape-format cookie file for authenticated yt-dlp sources.
; Leave unset (or commented out) to run anonymously — the tool only uses
; cookies when `file` is configured here.
; file = /path/to/cookies.txt
